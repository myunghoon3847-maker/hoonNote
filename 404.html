<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7C3AED">
  <title>Creative Note 경로 복구</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f8fafc;color:#172033;display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(100%,480px);background:#fff;border:1px solid #dbe3ef;border-radius:24px;padding:28px;box-shadow:0 14px 40px rgba(37,99,235,.10);text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#7c3aed;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}h1{margin:0 0 12px;font-size:24px}p{line-height:1.65;color:#5b677a}.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:14px 22px;border-radius:14px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800}
  </style>
  <script>
    (function () {
      var appRoot = "/hoonNote/";
      var current = window.location.pathname;
      if (current !== appRoot && current !== appRoot + "index.html") {
        window.location.replace(appRoot);
      }
    }());
  </script>
</head>
<body>
  <main class="card">
    <div class="mark">C</div>
    <h1>Creative Note 실행 경로를 확인하고 있습니다</h1>
    <p>자동 이동되지 않으면 아래 버튼을 눌러 Creative Note 홈으로 이동하세요.</p>
    <a class="btn" href="/hoonNote/">Creative Note 열기</a>
  </main>
</body>
</html>
